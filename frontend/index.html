<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura A.I — Assistente Inteligente</title>
    <meta name="description" content="Laura A.I — Seu assistente de inteligência artificial pessoal com voz neural.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ===== DESIGN SYSTEM ===== */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-cyan: #06d6a0;
            --accent-blue: #118ab2;
            --accent-purple: #7209b7;
            --accent-glow: rgba(6, 214, 160, 0.25);
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --user-bubble: linear-gradient(135deg, #118ab2 0%, #073b4c 100%);
            --laura-bubble: rgba(255, 255, 255, 0.06);
            --danger: #ef476f;
            --shadow-glow: 0 0 30px rgba(6, 214, 160, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(6, 214, 160, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(114, 9, 183, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(17, 138, 178, 0.04) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            0%   { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(15deg); }
        }

        /* ===== LAYOUT ===== */
        .app-container {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            height: 100vh; max-width: 900px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .laura-logo {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-cyan), var(--accent-blue), var(--accent-purple), var(--accent-cyan));
            display: flex; align-items: center; justify-content: center;
            animation: logoSpin 6s linear infinite;
            box-shadow: var(--shadow-glow);
        }
        @keyframes logoSpin {
            to { transform: rotate(360deg); }
        }
        .laura-logo-inner {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--bg-primary);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }
        .brand-text h1 {
            font-size: 18px; font-weight: 600;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-text span {
            font-size: 11px; color: var(--text-muted); font-weight: 400;
        }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon {
            width: 38px; height: 38px;
            border-radius: 50%; border: 1px solid var(--border-glass);
            background: var(--bg-glass); color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: var(--transition);
        }
        .btn-icon:hover {
            background: rgba(6, 214, 160, 0.1); color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }
        .btn-icon.active {
            background: rgba(6, 214, 160, 0.15); color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex; align-items: center; justify-content: center; gap: 24px;
            padding: 10px 24px; border-bottom: 1px solid var(--border-glass);
            font-size: 12px; color: var(--text-muted);
            flex-shrink: 0;
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent-cyan);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(6, 214, 160, 0.4); }
            50%      { opacity: 0.7; box-shadow: 0 0 0 6px rgba(6, 214, 160, 0); }
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 5px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 10px; }

        /* ===== MESSAGES ===== */
        .message {
            display: flex; gap: 12px; max-width: 80%;
            animation: msgSlide 0.35s ease-out;
        }
        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.laura { align-self: flex-start; }

        .msg-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px; flex-shrink: 0;
        }
        .message.user .msg-avatar {
            background: linear-gradient(135deg, #118ab2, #073b4c);
            color: white;
        }
        .message.laura .msg-avatar {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-primary);
        }

        .msg-bubble {
            padding: 12px 18px; border-radius: var(--radius);
            font-size: 14px; line-height: 1.65; word-wrap: break-word;
        }
        .message.user .msg-bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.laura .msg-bubble {
            background: var(--laura-bubble);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
            border-bottom-left-radius: 4px;
        }

        /* ===== TYPING INDICATOR ===== */
        .typing-indicator {
            display: none; align-self: flex-start;
            padding: 14px 20px; border-radius: var(--radius);
            background: var(--laura-bubble);
            border: 1px solid var(--border-glass);
            gap: 5px; align-items: center;
        }
        .typing-indicator.active { display: flex; }
        .typing-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent-cyan);
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30%           { transform: translateY(-8px); opacity: 1; }
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border-glass);
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }
        .input-wrapper {
            display: flex; gap: 10px; align-items: center;
            background: var(--bg-glass); border: 1px solid var(--border-glass);
            border-radius: 50px; padding: 6px 6px 6px 20px;
            transition: var(--transition);
        }
        .input-wrapper:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 214, 160, 0.1);
        }
        #chatInput {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-size: 14px;
            font-family: 'Inter', sans-serif;
        }
        #chatInput::placeholder { color: var(--text-muted); }

        .btn-mic {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: var(--bg-secondary); color: var(--text-secondary);
            cursor: pointer; font-size: 18px; display: flex;
            align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .btn-mic:hover { color: var(--accent-cyan); }
        .btn-mic.listening {
            background: var(--danger); color: white;
            animation: micPulse 1.5s ease-in-out infinite;
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 71, 111, 0.5); }
            50%      { box-shadow: 0 0 0 10px rgba(239, 71, 111, 0); }
        }
        .btn-mic.speaking {
            background: var(--accent-cyan); color: var(--bg-primary);
            animation: micPulse2 1.5s ease-in-out infinite;
        }
        @keyframes micPulse2 {
            0%, 100% { box-shadow: 0 0 0 0 rgba(6, 214, 160, 0.5); }
            50%      { box-shadow: 0 0 0 10px rgba(6, 214, 160, 0); }
        }

        .btn-send {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-primary); cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition); font-weight: 700;
        }
        .btn-send:hover { transform: scale(1.05); box-shadow: var(--shadow-glow); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ===== SOUND WAVE (when speaking) ===== */
        .sound-wave {
            display: none;
            align-items: flex-end; justify-content: center;
            gap: 3px; height: 20px;
            padding: 0 8px;
        }
        .sound-wave.active { display: flex; }
        .sound-bar {
            width: 3px; border-radius: 2px;
            background: var(--accent-cyan);
            animation: wave 0.8s ease-in-out infinite alternate;
        }
        .sound-bar:nth-child(1) { height: 8px;  animation-delay: 0.0s; }
        .sound-bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
        .sound-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
        .sound-bar:nth-child(4) { height: 18px; animation-delay: 0.3s; }
        .sound-bar:nth-child(5) { height: 6px;  animation-delay: 0.4s; }
        @keyframes wave {
            from { height: 4px; }
            to   { height: 20px; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .header { padding: 12px 16px; }
            .chat-area { padding: 16px; }
            .input-area { padding: 12px 16px 16px; }
            .message { max-width: 90%; }
            .status-bar { gap: 14px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="laura-logo">
                    <div class="laura-logo-inner">J</div>
                </div>
                <div class="brand-text">
                    <h1>LAURA A.I</h1>
                    <span>Assistente Inteligente</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon active" id="btnVoiceToggle" onclick="toggleAutoSpeak()" title="Ativar/Desativar Voz">
                    &#128266;
                </button>
                <button class="btn-icon" onclick="clearChat()" title="Limpar Conversa">
                    &#128465;
                </button>
            </div>
        </header>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Sistema Online</span>
            </div>
            <div class="status-item" id="clockDisplay">
                <span>--:--</span>
            </div>
            <div class="status-item" id="dateDisplay">
                <span>--/--/----</span>
            </div>
            <div class="sound-wave" id="soundWave">
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
                <div class="sound-bar"></div>
            </div>
        </div>

        <!-- CHAT -->
        <div class="chat-area" id="chatArea">
            <div class="message laura">
                <div class="msg-avatar">J</div>
                <div class="msg-bubble">
                    Olá! Eu sou o Laura, seu assistente de inteligencia artificial pessoal. 
                    Pode digitar sua mensagem ou clicar no microfone para usar a voz. Como posso ajudar?
                </div>
            </div>
        </div>

        <!-- TYPING -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>

        <!-- INPUT -->
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="chatInput" placeholder="Digite sua mensagem..." autocomplete="off" />
                <button class="btn-mic" id="btnMic" onclick="toggleVoice()" title="Falar">&#127908;</button>
                <button class="btn-send" id="btnSend" onclick="sendMessage()" title="Enviar">&#10148;</button>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const API_BASE = window.location.origin;
        let autoSpeak = true;
        let isSpeaking = false;
        let isListening = false;
        let recognition = null;
        let currentAudio = null;

        // ===== CLOCK =====
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clockDisplay').querySelector('span').textContent = `${h}:${m}`;
            const d = String(now.getDate()).padStart(2, '0');
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            document.getElementById('dateDisplay').querySelector('span').textContent = `${d}/${mo}/${y}`;
        }
        updateClock();
        setInterval(updateClock, 10000);

        // ===== SPEECH RECOGNITION =====
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'pt-BR';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('btnMic').classList.add('listening');
            };

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById('chatInput').value = transcript;
                sendMessage();
            };

            recognition.onerror = (e) => {
                console.error('Voice error:', e.error);
                stopListening();
            };

            recognition.onend = () => { stopListening(); };
        }

        function stopListening() {
            isListening = false;
            document.getElementById('btnMic').classList.remove('listening');
        }

        function toggleVoice() {
            if (!recognition) { alert('Reconhecimento de voz nao suportado neste navegador.'); return; }
            if (isListening) { recognition.stop(); }
            else { recognition.start(); }
        }

        // ===== TOGGLE VOICE OUTPUT =====
        function toggleAutoSpeak() {
            autoSpeak = !autoSpeak;
            const btn = document.getElementById('btnVoiceToggle');
            btn.classList.toggle('active', autoSpeak);
            btn.title = autoSpeak ? 'Voz Ativada' : 'Voz Desativada';
        }

        // ===== ADD MESSAGE TO CHAT =====
        function addMessage(text, sender) {
            const area = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.textContent = sender === 'user' ? 'V' : 'J';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = text;

            div.appendChild(avatar);
            div.appendChild(bubble);
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        // ===== SEND MESSAGE =====
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, 'user');
            input.value = '';

            const typing = document.getElementById('typingIndicator');
            typing.classList.add('active');
            document.getElementById('btnSend').disabled = true;

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });

                if (!res.ok) throw new Error('Erro na resposta');

                const data = await res.json();
                typing.classList.remove('active');

                addMessage(data.response, 'laura');

                if (autoSpeak) await speakText(data.response);

            } catch (err) {
                typing.classList.remove('active');
                addMessage('Desculpe, ocorreu um erro de conexao. Verifique se o servidor esta rodando.', 'laura');
            } finally {
                document.getElementById('btnSend').disabled = false;
            }
        }

        // ===== TTS PLAYBACK =====
        async function speakText(text) {
            if (isSpeaking && currentAudio) { currentAudio.pause(); }
            isSpeaking = true;

            const wave = document.getElementById('soundWave');
            const mic = document.getElementById('btnMic');
            wave.classList.add('active');
            mic.classList.add('speaking');

            try {
                const res = await fetch(`${API_BASE}/tts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!res.ok) throw new Error('TTS falhou');

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);

                currentAudio.onended = () => {
                    isSpeaking = false;
                    wave.classList.remove('active');
                    mic.classList.remove('speaking');
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                };

                currentAudio.onerror = () => {
                    isSpeaking = false;
                    wave.classList.remove('active');
                    mic.classList.remove('speaking');
                    currentAudio = null;
                };

                await currentAudio.play();

            } catch (err) {
                console.error('TTS Error:', err);
                isSpeaking = false;
                wave.classList.remove('active');
                mic.classList.remove('speaking');
            }
        }

        // ===== CLEAR CHAT =====
        function clearChat() {
            const area = document.getElementById('chatArea');
            area.innerHTML = '';
            addMessage('Conversa limpa. Como posso ajudar?', 'laura');
        }

        // ===== ENTER KEY =====
        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
